version: '3.8'

services:
  db2:
    image: icr.io/db2_community/db2
    privileged: true
    ports:
      - "50000:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD}
      DBNAME: clinic
    volumes:
      - ./db2data:/database
    healthcheck:
      test: ["CMD", "su", "-", "db2inst1", "-c", "db2 connect to clinic"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
