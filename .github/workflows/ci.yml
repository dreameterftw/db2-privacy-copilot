name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DB2_PASSWORD: ci-pass
      DB_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,ui]"
      - name: Verify CrewAI is active
        run: |
          python -c "from app.agents import CREWAI_AVAILABLE; assert CREWAI_AVAILABLE, 'CrewAI failed to load'"
      - name: Check critical lint rules
        run: ruff check --select E4,E7,E9,F63,F7,F82 app eval tests ui
      - name: Run database-independent tests
        run: pytest -m "not integration" -q
      - name: Scan application code
        run: bandit -r app -ll
      - name: Audit dependencies
        run: pip-audit

  integration:
    runs-on: ubuntu-latest
    needs: quality
    env:
      DB2_HOST: localhost
      DB2_PORT: "50000"
      DB2_DB: clinic
      DB2_USER: db2inst1
      DB2_PASSWORD: CiPassw0rd!2026
      DB2_SCHEMA: DB2INST1
      DB_MOCK: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,ui]"
      - name: Verify real Db2 driver is active
        run: |
          python -c "from app.db import MOCK_MODE; assert not MOCK_MODE, 'Db2 driver unavailable; refusing mock integration run'"
      - name: Start Db2
        run: |
          docker run -d --name db2 --privileged -p 50000:50000 \
            -e LICENSE=accept -e DB2INSTANCE=db2inst1 \
            -e DB2INST1_PASSWORD="$DB2_PASSWORD" -e DBNAME=clinic \
            icr.io/db2_community/db2
          ready=false
          for _ in $(seq 1 60); do
            if docker exec db2 su - db2inst1 -c "db2 connect to clinic"; then
              ready=true
              break
            fi
            sleep 15
          done
          if [ "$ready" != true ]; then
            docker logs db2
            exit 1
          fi
      - name: Initialize and seed demo data
        run: |
          python -m app.bootstrap
          python -m eval.seed
      - name: Run integration tests and evaluation gate
        run: |
          pytest tests -q
          python -m eval.run_eval --min-precision 0.90 --min-recall 0.95
