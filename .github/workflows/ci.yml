name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DB2_PASSWORD: ci-pass
      DB_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=84.1.0" wheel
      - run: pip install -e ".[dev,ui]"
      - name: Verify CrewAI is active
        run: |
          python -c "from app.agents import CREWAI_AVAILABLE; assert CREWAI_AVAILABLE, 'CrewAI failed to load'"
      - name: Check critical lint rules
        run: ruff check --select E4,E7,E9,F63,F7,F82 app eval security tests ui
      - name: Run database-independent tests
        run: pytest -m "not integration" -q
      - name: Scan application code
        run: bandit -r app -ll
      - name: Exclude local project distribution from the audit
        run: python -m pip uninstall --yes db2-privacy-copilot
      - name: Audit dependencies
        run: python security/run_audit.py

  integration:
    runs-on: ubuntu-latest
    needs: quality
    env:
      DB2_HOST: localhost
      DB2_PORT: "50000"
      DB2_DB: clinic
      DB2_USER: db2inst1
      DB2_PASSWORD: CiPassw0rd!2026
      DB2_SCHEMA: DB2INST1
      DB_MOCK: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=84.1.0" wheel
      - run: pip install -e ".[dev,ui]"
      - name: Verify real Db2 driver is active
        run: |
          python -c "from app.db import MOCK_MODE; assert not MOCK_MODE, 'Db2 driver unavailable; refusing mock integration run'"
      - name: Start Db2
        run: |
          docker run -d --name db2 --privileged -p 50000:50000 \
            -e LICENSE=accept -e DB2INSTANCE=db2inst1 \
            -e DB2INST1_PASSWORD="$DB2_PASSWORD" -e DBNAME=clinic \
            icr.io/db2_community/db2
          for i in $(seq 1 120); do
            if docker logs db2 2>&1 | grep -q "Setup has completed"; then
              echo "Db2 setup completed after $((i * 10))s"
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' db2)" != "true" ]; then
              echo "Db2 container stopped during setup"
              docker logs --tail 80 db2
              exit 1
            fi
            sleep 10
          done
          if ! docker logs db2 2>&1 | grep -q "Setup has completed"; then
            docker logs --tail 80 db2
            echo "Db2 setup did not finish within 20 minutes"
            exit 1
          fi
          ready_checks=0
          for _ in $(seq 1 20); do
            if docker exec db2 su - db2inst1 -c \
              "db2 connect to clinic >/dev/null 2>&1 && db2 connect reset >/dev/null 2>&1"; then
              ready_checks=$((ready_checks + 1))
              if [ "$ready_checks" -ge 3 ]; then
                echo "Db2 accepted three consecutive health checks"
                exit 0
              fi
            else
              ready_checks=0
            fi
            sleep 5
          done
          echo "Db2 did not remain connectable after setup"
          docker logs --tail 80 db2
          exit 1
      - name: Initialize and seed demo data
        run: |
          bootstrapped=false
          for attempt in 1 2 3; do
            if python -m app.bootstrap; then
              bootstrapped=true
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Bootstrap failed after $attempt attempts"
              docker logs --tail 100 db2
              exit 1
            fi
            echo "Bootstrap attempt $attempt failed; checking Db2 before retry"
            db_ready=false
            for _ in $(seq 1 20); do
              if docker exec db2 su - db2inst1 -c \
                "db2 connect to clinic >/dev/null 2>&1 && db2 connect reset >/dev/null 2>&1"; then
                db_ready=true
                break
              fi
              sleep 5
            done
            if [ "$db_ready" != true ]; then
              echo "Db2 did not recover after bootstrap failure"
              docker logs --tail 100 db2
              exit 1
            fi
            sleep 10
          done
          if [ "$bootstrapped" != true ]; then
            echo "Bootstrap did not complete"
            exit 1
          fi
          python -m eval.seed
      - name: Run integration tests and evaluation gate
        run: |
          pytest tests -q
          python -m eval.run_eval --min-precision 0.90 --min-recall 0.95
